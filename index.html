// CSSが読み込まれる前にテーマ属性を確定させ、切り替え時のチラつきを防ぐ（daigorou-tools トップと共通）
(function(){try{var t=localStorage.getItem('daigorou-tools-theme');document.documentElement.setAttribute('data-theme',(t==='light')?'light':'dark');}catch(e){}})();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
html[data-theme="dark"],:root{
  --bg:#0b0f13;--panel:#131920;--line:#26303a;--lineSoft:#1c242c;--text:#d7dee4;--sub:#7c8894;--paper:#eef3f6;
  --acc:#29e0c4;--accText:#04241f;--btn:#171f27;--btnHover:#1f2a34;--danger:#ff6b6b;--topbar:rgba(11,15,19,.9);
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
html[data-theme="light"]{
  --bg:#ffffff;--panel:#ffffff;--line:#dbe0e3;--lineSoft:#e9ecee;--text:#222a33;--sub:#828d99;--paper:#12181f;
  --acc:#0f9c8c;--accText:#ffffff;--btn:#f1f3f4;--btnHover:#e6eaec;--danger:#d93a3a;--topbar:rgba(255,255,255,.9);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse 900px 500px at 85% -10%,rgba(41,224,196,.06),transparent 60%),var(--bg);min-height:100vh;color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 32px;background:var(--topbar);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:28px;height:28px;border-radius:6px;display:block}
h1{font-size:16px;margin:0;font-weight:900;color:var(--paper);letter-spacing:.01em}
.toplinks{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lang-select{font-family:var(--mono);font-size:11px;background:var(--btn);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:7px 8px;min-height:30px;cursor:pointer}
.theme-toggle{width:30px;height:30px;min-height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--sub);font-size:15px;line-height:1;cursor:pointer;padding:0}
.theme-toggle:hover{border-color:var(--acc);color:var(--text)}
select,input[type=text],button{font:inherit;color:var(--text)}
select,input[type=text]{background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:13px;min-width:0}
button{background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;min-height:32px}
button:hover{background:var(--btnHover)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--accText);font-weight:600}
button.danger{color:var(--danger)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;padding:14px;max-width:1280px;margin:0 auto}
.stage{min-width:0;position:relative}
#floatBar{position:absolute;z-index:6;display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.35);transform:translateX(-50%)}
#floatBar[hidden]{display:none}
#floatBar button{min-height:36px;padding:6px 10px;font-size:13px;white-space:nowrap}
canvas{display:block;width:100%;height:auto;border-radius:6px;touch-action:none;box-shadow:0 0 0 1px var(--line)}
.note{color:var(--sub);font-size:11px;margin:6px 2px 0}
aside{display:flex;flex-direction:column;gap:8px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
h2{font-size:13px;margin:0 0 10px;color:var(--sub);font-weight:600}
.types{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.types[data-cols="3"]{grid-template-columns:repeat(3,1fr)}
.types[data-cols="3"] button{padding:3px 5px;gap:4px;font-size:11.5px;line-height:1.2}
.types[data-cols="3"] .sw{width:10px;height:10px}
.types button{display:flex;align-items:center;gap:8px;text-align:left;padding:3px 8px;min-height:30px;font-size:12px}
.sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.35);flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
.row.two>button{flex:1 1 calc(50% - 4px)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--sub)}
.empty{color:var(--sub);font-size:13px;margin:0}
details.acc{background:var(--panel);border:1px solid var(--line);border-radius:8px}
details.acc>summary{cursor:pointer;padding:0 12px;min-height:34px;font-size:12px;font-weight:600;color:var(--sub);list-style:none;display:flex;justify-content:space-between;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"▸";transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(90deg)}
details.acc>div{padding:0 12px 12px}
.row.sel input,.row.sel select{flex:1 1 120px;min-width:0}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc);margin:0}
.floors{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.floors button{min-height:30px;padding:3px 12px;font-size:12px}
.floors button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accText);font-weight:600}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{flex:1 1 0;min-height:34px;padding:3px 4px;font-size:11.5px;line-height:1.25;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--sub)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--acc);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.cbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.cbar .note{margin:0}
.cbtns{display:flex;gap:4px}
.cbtns button{min-width:30px;min-height:28px;padding:2px 8px;font-size:13px}
.cbtns button:disabled{opacity:.35;cursor:default}
#zoomLbl{min-width:52px;font-family:var(--mono);font-size:11px}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:20;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:2px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.menu[hidden]{display:none}
.menu button{border:0;background:transparent;text-align:left;min-height:32px;white-space:nowrap}
.menu button:hover{background:var(--btnHover)}
#openBtns button{padding:3px 8px;min-height:30px;font-size:12px}
#openBtns .row{gap:4px}
#openBtns .row.two>button{flex:1 1 calc(50% - 2px)}
#openBtns .row.three>button{flex:1 1 calc(33.333% - 3px);padding:3px 4px;font-size:11.5px;line-height:1.2}
.grp{font-size:11px;color:var(--sub);margin:8px 0 4px}
#openBtns .grp:first-child{margin-top:0}
.tl-btn{min-height:30px;padding:6px 12px;font-size:12.5px;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accText);font-weight:600}
a.back{display:inline-flex;align-items:center;min-height:30px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--btn);color:var(--text);text-decoration:none;font-size:12.5px;white-space:nowrap}
a.back:hover{background:var(--btnHover)}
footer{text-align:center;padding:36px 20px;border-top:1px solid var(--lineSoft);margin-top:20px}
.footer-note{margin:0 0 10px;font-size:12px;color:var(--sub)}
.footer-copyright{font-family:var(--mono);font-size:10.5px;color:var(--sub);opacity:.6}
#printArea{display:none}
@media (min-width:821px){
  aside{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}
}
@media (max-width:820px){
  main{grid-template-columns:1fr;padding:0 12px 16px;gap:12px}
  .stage{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 6px}
  header{padding:12px}
  select,input[type=text]{font-size:16px}
  .lang-select{font-size:11px}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{display:block;max-width:100%;max-height:calc(100vh - 2px);margin:0 auto}
}
</style>
</head>

<header>
  <div class="brand"><img class="brand-logo" src="favicon.png" alt="" width="28" height="28"><h1 id="title">間取り図メーカー</h1></div>
  <nav class="toplinks">
    <div class="menuwrap">
      <button type="button" class="tl-btn" id="fileBtn"><span data-i18n="menu_file"></span> ▾</button>
      <div class="menu" id="fileMenu" hidden>
        <button type="button" id="mSave" data-i18n="menu_save"></button>
        <button type="button" id="mLoad" data-i18n="menu_load"></button>
        <button type="button" id="mNew" data-i18n="menu_new"></button>
      </div>
      <input type="file" id="fileIn" accept="application/json,.json" hidden>
    </div>
    <button type="button" class="tl-btn primary" id="pngBtn" data-i18n="save_png"></button>
    <button type="button" class="tl-btn" id="printBtn" data-i18n="print"></button>
    <a class="back" href="https://daigorou-addon.github.io/daigorou-tools/" data-i18n="back"></a>
    <button id="themeBtn" class="theme-toggle" type="button"></button>
    <select id="lang" class="lang-select" aria-label="Language">
      <option value="ja">日本語</option>
      <option value="en">English</option>
      <option value="ko">한국어</option>
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="es">Español</option>
    </select>
  </nav>
</header>
<main>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div id="floatBar" hidden>
      <button type="button" id="fbDup" data-i18n="dup"></button>
      <button type="button" id="fbRot" data-i18n="rotate"></button>
      <button type="button" id="fbFlip" data-i18n="flip"></button>
      <button type="button" id="fbDir" data-i18n="dir_s"></button>
      <button type="button" id="fbDel" class="danger" data-i18n="del"></button>
    </div>
    <div class="cbar">
      <p class="note" id="gridNote"></p>
      <div class="cbtns">
        <button type="button" id="undoBtn">↶</button><button type="button" id="redoBtn">↷</button>
        <button type="button" id="zoomOut">−</button><button type="button" id="zoomLbl">100%</button><button type="button" id="zoomIn">+</button><button type="button" id="zoomFit">⤢</button>
      </div>
    </div>
  </div>
  <aside>
    <div class="floors" id="floors"></div>
    <details class="acc" id="selSec" open hidden>
      <summary data-i18n="selected"></summary>
      <div class="row sel">
        <input type="text" id="rName">
        <select id="rType"></select>
      </div>
    </details>
    <div class="seg" role="group">
      <button type="button" id="modeSimple" data-i18n="mode_simple"></button>
      <button type="button" id="modeFull" data-i18n="mode_full"></button>
    </div>
    <div class="tabs" role="tablist" id="palTabs">
      <button type="button" role="tab" data-tab="room" data-i18n="tab_room"></button>
      <button type="button" role="tab" data-tab="open" data-i18n="tab_open"></button>
      <button type="button" role="tab" data-tab="furn" id="tabFurn" data-i18n="tab_furn"></button>
    </div>
    <div class="panel" id="panRoom"><div class="types" id="types"></div></div>
    <div class="panel" id="panOpen" hidden><div id="openBtns"></div></div>
    <div class="panel" id="panFurn" hidden>
      <label class="chk"><input type="checkbox" id="furnLabelChk"><span data-i18n="furn_label"></span></label>
      <div class="types" id="furnBtns"></div>
    </div>
    <p class="note" id="hint"></p>
  </aside>
</main>
<footer>
  <p class="footer-note" data-i18n="privacy"></p>
  <div class="footer-copyright">Copyright (C) 2026 daigorou-tools. All rights reserved.</div>
</footer>
<div id="printArea"><img id="printImg" alt=""></div>

      c.fillStyle='rgba(196,160,120,.55)';c.strokeStyle='#8a6b4a';
      c.beginPath();c.rect(x0,y0,w,h);c.fill();c.stroke();
      const cols=['#e57fa0','#f2c14e','#c58be0'];let k=0;
      for(let j=0.5;j<h;j+=0.7)for(let i=0.5;i<w;i+=0.7){
        c.fillStyle=cols[(k++)%3];c.beginPath();c.arc(x0+i,y0+j,0.13,0,Math.PI*2);c.fill();
      }
      break;}
    case 'fence':{
      c.fillStyle='#7a7a7a';c.strokeStyle='#555';c.lineWidth=0.04;
      c.beginPath();c.rect(x0,-h/2,w,h);c.fill();c.stroke();
      c.fillStyle='#fff';
      for(let i=0;i<=w+0.001;i+=1){const px=Math.min(x0+i,x0+w-0.1);c.beginPath();c.rect(px-0.1,-h/2-0.05,0.2,h+0.1);c.fill();c.stroke();}
      break;}
    case 'gate':{
      const lf=Math.min((w-0.5)/2,h-0.2);
      c.fillStyle='#7a7a7a';
      c.beginPath();c.rect(x0,y0+h-0.45,0.35,0.45);c.fill();c.stroke();c.beginPath();c.rect(x0+w-0.35,y0+h-0.45,0.35,0.45);c.fill();c.stroke();
      c.lineWidth=0.09;gL(c,x0+0.17,y0+h-0.45,x0+0.17,y0+h-0.45-lf);gL(c,x0+w-0.17,y0+h-0.45,x0+w-0.17,y0+h-0.45-lf);
      c.lineWidth=0.04;
      c.beginPath();c.arc(x0+0.17,y0+h-0.45,lf,-Math.PI/2,0);c.stroke();
      c.beginPath();c.arc(x0+w-0.17,y0+h-0.45,lf,Math.PI,Math.PI*1.5);c.stroke();
      break;}
    case 'shed':
      c.fillStyle='rgba(222,212,190,.95)';c.beginPath();c.rect(x0,y0,w,h);c.fill();c.stroke();
      if(w>=h)gL(c,x0,0,x0+w,0);else gL(c,0,y0,0,y0+h);
      break;
    case 'north':{
      const R=Math.min(w,h)/2*0.78;
      c.fillStyle='rgba(255,255,255,.95)';c.beginPath();c.arc(0,0,R,0,Math.PI*2);c.fill();c.stroke();
      c.beginPath();c.moveTo(0,-R*0.8);c.lineTo(-R*0.38,R*0.6);c.lineTo(0,R*0.28);c.closePath();c.fillStyle='#333';c.fill();
      c.beginPath();c.moveTo(0,-R*0.8);c.lineTo(R*0.38,R*0.6);c.lineTo(0,R*0.28);c.closePath();c.fillStyle='#fff';c.fill();c.stroke();
      c.fillStyle='#333';c.font='700 '+(R*0.62)+'px '+FONT;c.textAlign='center';c.textBaseline='bottom';c.fillText('N',0,-R-0.08);
      break;}
    case 'text':{
      const t=f.text||'';if(!t)break;
      let fs=h*0.72;c.font='500 '+fs+'px '+FONT;c.textAlign='center';c.textBaseline='middle';
      const mw=c.measureText(t).width;if(mw>w*0.98)fs=fs*w*0.98/mw;
      c.font='500 '+fs+'px '+FONT;c.lineJoin='round';c.lineWidth=fs*0.2;c.strokeStyle='rgba(255,255,255,.85)';c.strokeText(t,0,0);
      c.fillStyle=INK;c.fillText(t,0,0);
      break;}
  }
  c.restore();
}
// default fixtures for a room, created as normal movable objects
function genFixtures(r){
  r.fxDone=true;r.fxV=2;
  const {x,y,w,h}=r;
  const add=(f,cx,cy,rot,fw,fh)=>furn.push({id:uid++,f,x:cx,y:cy,r:rot,w:fw,h:fh,rid:r.id});
  switch(r.t){
    case 'ldk':case 'dk':case 'kitchen':{
      const vert=r.t==='kitchen'&&h>w,len=Math.min(6,(vert?h:w)-0.8);
      if(len>=2.5){if(vert)add('kitchen',x+1.15,y+0.4+len/2,3,len,1.5);else add('kitchen',x+0.4+len/2,y+1.15,0,len,1.5);}
      break;}
    case 'bath':{const tw=w-0.9,th=Math.min(h-0.9,2.4);if(tw>=2&&th>=1.4)add('tub',x+0.45+tw/2,y+0.45+th/2,0,tw,th);break;}
    case 'toilet':if(w>=1.7&&h>=2.4)add('toilet',x+w/2,y+1.2,0,1.5,2);break;
    case 'washroom':{
      const bw=Math.min(w-0.8,2);
      if(bw>=1.2)add('basin',x+0.4+bw/2,y+0.9,0,bw,1.2);
      if(w>=4&&h>=3.5)add('washer',x+w-1.1,y+h-1.1,0,1.4,1.4);
      break;}
    case 'parking':{
      const vertical=h>=w,cw=Math.min(4,(vertical?w:h)-1.2),cl=Math.min(10,(vertical?h:w)-1.2);
      if(cw>=2.5&&cl>=6)add('car',x+w/2,y+h/2,vertical?0:1,cw,cl);
      break;}
    case 'entrance':{const sb=Math.min(2.4,w-0.6);if(sb>=1)add('shoebox',x+w-0.3-sb/2,y+0.7,0,sb,0.8);break;}
  }
}
// floor patterns that belong to the room itself
function drawDeco(c,r){
  const {x,y,w,h}=r;
  c.save();c.lineJoin='round';roomPath(c,r);c.clip();
  switch(r.t){
    case 'washitsu':{
      c.strokeStyle='#86a574';c.lineWidth=0.04;
      const a=h>=w?2:4,b=h>=w?4:2;
      for(let i=a;i<w;i+=a)gL(c,x+i,y,x+i,y+h);
      for(let j=b;j<h;j+=b)gL(c,x,y+j,x+w,y+j);
      break;}
    case 'terrace':case 'roofbal':{
      c.strokeStyle='#b9ad92';c.lineWidth=0.04;
      if(w>=h){for(let j=1;j<h;j++)gL(c,x,y+j,x+w,y+j);}else{for(let i=1;i<w;i++)gL(c,x+i,y,x+i,y+h);}
      break;}
    case 'approach':{
      c.strokeStyle='#bdb5a4';c.lineWidth=0.04;
      const vert=h>=w,Ln=vert?h:w,Tn=vert?w:h;
      const ln=(t1,l1,t2,l2)=>vert?gL(c,x+t1,y+l1,x+t2,y+l2):gL(c,x+l1,y+t1,x+l2,y+t2);
      for(let r=0;r*1.5<Ln;r++){
        const a=r*1.5,b=Math.min(a+1.5,Ln);
        if(r>0)ln(0,a,Tn,a);
        if(r%2===0)ln(Tn/2,a,Tn/2,b);else{ln(Tn/4,a,Tn/4,b);ln(Tn*3/4,a,Tn*3/4,b);}
      }
      break;}
    case 'garden':{
      c.fillStyle='#8fbf7a';
      for(let j=1;j<h;j+=2)for(let i=1;i<w;i+=2){
        const px=x+i+(((j-1)/2)%2?1:0),py=y+j;
        if(px<x+w-0.3){c.beginPath();c.arc(px,py,0.09,0,Math.PI*2);c.fill();}
      }
      break;}
    case 'closet':case 'oshiire':case 'mb':
      c.strokeStyle='#9a9a9a';c.lineWidth=0.04;gL(c,x,y,x+w,y+h);gL(c,x+w,y,x,y+h);break;
    case 'wcl':case 'sic':
      c.strokeStyle='#9a9a9a';c.lineWidth=0.04;c.setLineDash([0.3,0.2]);gL(c,x+0.4,y+h/2,x+w-0.4,y+h/2);break;
  }
  c.restore();
}

/* ---------- rooms with cut corners ---------- */
function roomPts(r){
  const k=r.cut||[0,0,0,0],a=k[0],b=k[1],e=k[2],d=k[3],x=r.x,y=r.y,w=r.w,h=r.h;
  const raw=[[x+a,y],[x+w-b,y],[x+w,y+b],[x+w,y+h-e],[x+w-e,y+h],[x+d,y+h],[x,y+h-d],[x,y+a]];
  const out=[];
  for(const q of raw){const l=out[out.length-1];if(!l||Math.abs(l[0]-q[0])>1e-6||Math.abs(l[1]-q[1])>1e-6)out.push(q);}
  const f=out[0],l=out[out.length-1];
  if(out.length>1&&Math.abs(f[0]-l[0])<1e-6&&Math.abs(f[1]-l[1])<1e-6)out.pop();
  return out;
}
function insetPts(pts,d){
  const n=pts.length,Ls=[];
  for(let i=0;i<n;i++){
    const p=pts[i],q=pts[(i+1)%n],dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy)||1;
    Ls.push({px:p[0]-dy/len*d,py:p[1]+dx/len*d,dx:dx/len,dy:dy/len});
  }
  const out=[];
  for(let i=0;i<n;i++){
    const A=Ls[(i+n-1)%n],B=Ls[i],cr=A.dx*B.dy-A.dy*B.dx;
    if(Math.abs(cr)<1e-9){out.push([B.px,B.py]);continue;}
    const t=((B.px-A.px)*B.dy-(B.py-A.py)*B.dx)/cr;
    out.push([A.px+A.dx*t,A.py+A.dy*t]);
  }
  return out;
}
function pathPts(c,pts){c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();}
function roomPath(c,r){pathPts(c,roomPts(r));}
function inRoom(r,p){
  const pts=roomPts(r),n=pts.length;
  for(let i=0;i<n;i++){
    const a=pts[i],b=pts[(i+1)%n];
    if((b[0]-a[0])*(p.y-a[1])-(b[1]-a[1])*(p.x-a[0])<-1e-9)return false;
  }
  return true;
}
function cutMax(r,i){
  const k=r.cut||[0,0,0,0];
  return [Math.min(r.w-k[1],r.h-k[3]),Math.min(r.w-k[0],r.h-k[2]),Math.min(r.w-k[3],r.h-k[1]),Math.min(r.w-k[2],r.h-k[0])][i];
}
function normCut(r){
  if(!r.cut)return;
  for(let i=0;i<4;i++)r.cut[i]=clamp(r.cut[i],0,Math.max(0,cutMax(r,i)));
}
const CUT_DIR=[[1,1],[-1,1],[-1,-1],[1,-1]];
const cutCorner=(r,i)=>[[r.x,r.y],[r.x+r.w,r.y],[r.x+r.w,r.y+r.h],[r.x,r.y+r.h]][i];
function cutHandles(r,hpx){
  if(!hpx)return[];
  const off=4.4*hpx,m=Math.min(r.w,r.h);
  if(m<3||off*2>m*0.85)return[];
  const k=r.cut||[0,0,0,0];
  return[0,1,2,3].map(i=>{const c0=cutCorner(r,i),d=CUT_DIR[i];return{i,x:c0[0]+d[0]*(k[i]/2+off),y:c0[1]+d[1]*(k[i]/2+off)};});
}

/* ---------- render ---------- */
function render(c,s,o){
  const {grid=false,selObj=null,ox=0,oy=0,cw=W,ch=H,hpx=0,full=false,ghost=null}=o;
  const WL=full?0.2:WALL;
  c.setTransform(1,0,0,1,0,0);
  c.fillStyle='#fff';c.fillRect(0,0,cw*s,ch*s);
  c.save();c.scale(s,s);c.translate(-ox,-oy);
  if(grid){
    c.lineWidth=0.04;
    for(let i=0;i<=WW;i++){c.strokeStyle=i%2?'rgba(60,80,110,.10)':'rgba(60,80,110,.24)';c.beginPath();c.moveTo(i,0);c.lineTo(i,WH);c.stroke();}
    for(let j=0;j<=WH;j++){c.strokeStyle=j%2?'rgba(60,80,110,.10)':'rgba(60,80,110,.24)';c.beginPath();c.moveTo(0,j);c.lineTo(WW,j);c.stroke();}
  }
  if(ghost){
    c.save();c.setLineDash([0.4,0.3]);c.lineWidth=0.08;c.strokeStyle='rgba(60,80,110,.45)';c.fillStyle='rgba(60,80,110,.07)';
    for(const g of ghost){pathPts(c,roomPts(g));c.fill();c.stroke();}
    c.restore();
  }
  c.lineJoin='miter';
  const outs=rooms.filter(r=>OUT.includes(r.t)),ins=rooms.filter(r=>!OUT.includes(r.t));
  for(const r of outs){
    c.strokeStyle=full?'#7d8a78':'#8a948a';c.lineWidth=0.1;
    c.setLineDash(r.t==='garden'||r.t==='parking'?[0.4,0.25]:[]);roomPath(c,r);c.stroke();c.setLineDash([]);
    c.fillStyle=colorOf(r.t,full);pathPts(c,insetPts(roomPts(r),0.05));c.fill();
  }
  c.strokeStyle=full?'#2b2b2b':INK;c.lineWidth=WL;
  for(const r of ins){roomPath(c,r);c.stroke();}
  for(const r of ins){c.fillStyle=colorOf(r.t,full);pathPts(c,insetPts(roomPts(r),WL/2));c.fill();}
  if(full)for(const r of rooms)drawDeco(c,r);
  for(const f of furn)if(full||f.s)drawFurn(c,f);
  c.restore();

  // labels (pixel space)
  c.save();c.textAlign='center';c.textBaseline='middle';
  for(const r of rooms){
    const cx=(r.x+r.w/2-ox)*s,cy=(r.y+r.h/2-oy)*s,maxW=(r.w-WALL*2)*s-4;
    let fs=s*(full?0.95:1.1);const name=roomName(r);
    c.font=`600 ${fs}px ${FONT}`;
    const mw=c.measureText(name).width;
    if(mw>maxW)fs=Math.max(s*0.4,fs*maxW/mw);
    const low=full&&(r.t==='bath'||r.t==='washroom'||r.t==='toilet');
    const two=r.h>=3&&!low,ny=low?(r.y+r.h-0.6-oy)*s:(two?cy-fs*0.6:cy);
    c.lineJoin='round';c.strokeStyle='rgba(255,255,255,.85)';
    c.font=`600 ${fs}px ${FONT}`;
    if(full){c.lineWidth=fs*0.22;c.strokeText(name,cx,ny);}
    c.fillStyle=INK;c.fillText(name,cx,ny);
    if(two){
      c.font=`${fs*0.8}px ${FONT}`;
      if(full){c.lineWidth=fs*0.18;c.strokeText(areaTxt(r),cx,cy+fs*0.6);}
      c.fillStyle='#4a5666';c.fillText(areaTxt(r),cx,cy+fs*0.6);
    }
  }
  if(full&&furnLabels){
    for(const f of furn){
      if(['text','north','tree','flowerbed','fence'].includes(f.f))continue;
      const b=fbox(f),name=I[lang].furn[f.f],cx=(b.x+b.w/2-ox)*s,cy=(b.y+b.h/2-oy)*s,maxW=b.w*s-4;
      let fs=s*0.8;
      c.font=`500 ${fs}px ${FONT}`;
      const mw=c.measureText(name).width;
      if(mw>maxW)fs=Math.max(s*0.5,fs*maxW/mw);
      c.font=`500 ${fs}px ${FONT}`;
      c.lineJoin='round';c.lineWidth=fs*0.22;c.strokeStyle='rgba(255,255,255,.85)';c.strokeText(name,cx,cy);
      c.fillStyle=INK;c.fillText(name,cx,cy);
    }
  }
  c.restore();

  // doors & windows
  c.save();c.scale(s,s);c.translate(-ox,-oy);
  for(const it of items){
    c.save();c.translate(it.x,it.y);
    if(it.o==='v')c.rotate(Math.PI/2);
    if(it.d&1)c.scale(-1,1);
    if(it.d&2)c.scale(1,-1);
    const L=it.len,t=0.5;
    c.fillStyle='#fff';c.fillRect(-L/2,-t/2,L,t);
    drawOpenKind(c,it.k,L,t);
    c.restore();
  }
  // selection
  if(selObj){
    c.strokeStyle=ACC;c.lineWidth=0.08;c.setLineDash([0.3,0.2]);
    if(selObj.k==='room'){
      const r=selObj.o;roomPath(c,r);c.stroke();c.setLineDash([]);
      if(hpx){
        c.fillStyle='#fff';c.lineWidth=0.06;
        for(const h of handlePts(r)){c.beginPath();c.rect(h.x-hpx,h.y-hpx,hpx*2,hpx*2);c.fill();c.stroke();}
        for(const h of cutHandles(r,hpx)){c.beginPath();c.arc(h.x,h.y,hpx*1.1,0,Math.PI*2);c.fill();c.stroke();}
      }
    }else if(selObj.k==='furn'){
      const b=fbox(selObj.o);
      c.strokeRect(b.x,b.y,b.w,b.h);c.setLineDash([]);
      if(hpx){
        c.fillStyle='#fff';c.lineWidth=0.06;
        for(const h of handlePts(b)){c.beginPath();c.rect(h.x-hpx,h.y-hpx,hpx*2,hpx*2);c.fill();c.stroke();}
      }
    }else{
      const it=selObj.o,L=it.len+0.6,T=1.8;
      const w=it.o==='h'?L:T,h=it.o==='h'?T:L;
      c.strokeRect(it.x-w/2,it.y-h/2,w,h);c.setLineDash([]);
      if(RESIZABLE.includes(it.k)&&hpx){
        c.fillStyle='#fff';c.lineWidth=0.06;
        for(const sg of [-1,1]){
          const hx=it.o==='h'?it.x+sg*it.len/2:it.x,hy=it.o==='h'?it.y:it.y+sg*it.len/2;
          c.beginPath();c.rect(hx-hpx,hy-hpx,hpx*2,hpx*2);c.fill();c.stroke();
        }
      }
    }
  }
  c.restore();
}
function fbox(f){
  const q=f.r%2,ew=q?f.h:f.w,eh=q?f.w:f.h;
  return{x:f.x-ew/2,y:f.y-eh/2,w:ew,h:eh};
}
function selBBox(){
  if(sel.k==='room')return{x:sel.o.x,y:sel.o.y,w:sel.o.w,h:sel.o.h};
  if(sel.k==='furn')return fbox(sel.o);
  const it=sel.o,L=it.len+0.6,T=1.8,w=it.o==='h'?L:T,h=it.o==='h'?T:L;
  return{x:it.x-w/2,y:it.y-h/2,w,h};
}
function placeBar(){
  const bar=$('floatBar');
  if(!sel||drag){bar.hidden=true;return;}
  $('fbRot').hidden=sel.k!=='furn';
  $('fbFlip').hidden=!(sel.k==='furn'&&FLIPPABLE.includes(sel.o.f));
  if(sel.k==='furn')$('fbRot').textContent=sel.o.f==='north'?tr('rotate15'):tr('rotate');
  $('fbDir').hidden=!(sel.k==='item'&&DIRMASK[sel.o.k]);
  bar.hidden=false;
  const b=selBBox(),cw=cvs.clientWidth,ch=cvs.clientHeight,bw=bar.offsetWidth,bh=bar.offsetHeight;
  let cx=(b.x+b.w/2-vx)/VW*cw,top=(b.y-vy)/VH*ch-bh-8;
  if(top<4)top=(b.y+b.h-vy)/VH*ch+8;
  if(top+bh>ch-2)top=Math.max(4,ch-bh-4);
  cx=clamp(cx,bw/2+4,cw-bw/2-4);
  bar.style.left=(cvs.offsetLeft+cx)+'px';
  bar.style.top=(cvs.offsetTop+top)+'px';
}
function draw(){
  const ppu=cvs.getBoundingClientRect().width/VW||10;
  render(ctx,CELL*z,{grid:true,selObj:sel,hpx:5/ppu,full:mode==='estate',ghost:cur>0?floors[cur-1].rooms:null,ox:vx,oy:vy,cw:VW,ch:VH});
  placeBar();
}

/* ---------- hit testing ---------- */
function handlePts(r){
  const xs=[r.x,r.x+r.w/2,r.x+r.w],ys=[r.y,r.y+r.h/2,r.y+r.h],n=[['n','','s'],['w','','e']],out=[];
  for(let j=0;j<3;j++)for(let i=0;i<3;i++){
    if(i===1&&j===1)continue;
    out.push({x:xs[i],y:ys[j],n:(j===0?'n':j===2?'s':'')+(i===0?'w':i===2?'e':'')});
  }
  return out;
}
function pt(e){const r=cvs.getBoundingClientRect();return{x:vx+(e.clientX-r.left)/r.width*VW,y:vy+(e.clientY-r.top)/r.height*VH,ppu:r.width/VW};}
function hitItem(p){
  for(let i=items.length-1;i>=0;i--){
    const it=items[i],a=it.o==='h'?it.len/2+0.3:0.9,b=it.o==='h'?0.9:it.len/2+0.3;
    if(Math.abs(p.x-it.x)<=a&&Math.abs(p.y-it.y)<=b)return it;
  }
  return null;
}
function hitFurn(p){
  for(let i=furn.length-1;i>=0;i--){
    const f=furn[i];if(!(mode==='estate'||f.s))continue;
    const q=f.r%2,hw=Math.max((q?f.h:f.w)/2,0.6),hh=Math.max((q?f.w:f.h)/2,0.6);
    if(Math.abs(p.x-f.x)<=hw&&Math.abs(p.y-f.y)<=hh)return f;
  }
  return null;
}
function hitRoom(p){
  for(let i=rooms.length-1;i>=0;i--){const r=rooms[i];if(inRoom(r,p))return r;}
  return null;
}

/* ---------- opening snap ---------- */
function snapItem(it,p){
  let best=null,bd=1.6;
  for(const r of rooms){
    const segs=[
      {o:'h',f:r.y,a:r.x+(r.cut?r.cut[0]:0),b:r.x+r.w-(r.cut?r.cut[1]:0)},
      {o:'h',f:r.y+r.h,a:r.x+(r.cut?r.cut[3]:0),b:r.x+r.w-(r.cut?r.cut[2]:0)},
      {o:'v',f:r.x,a:r.y+(r.cut?r.cut[0]:0),b:r.y+r.h-(r.cut?r.cut[3]:0)},
      {o:'v',f:r.x+r.w,a:r.y+(r.cut?r.cut[1]:0),b:r.y+r.h-(r.cut?r.cut[2]:0)}
    ];
    for(const sg of segs){
      const al=sg.o==='h'?p.x:p.y,pp=sg.o==='h'?p.y:p.x,ca=clamp(al,sg.a,sg.b);
      const d=Math.hypot(ca-al,sg.f-pp);
      if(d<bd){bd=d;best=sg;}
    }
  }
  if(best){
    const al=best.o==='h'?p.x:p.y,lo=best.a+it.len/2,hi=best.b-it.len/2;
    const v=hi>=lo?clamp(Math.round(al*2)/2,lo,hi):(best.a+best.b)/2;
    it.o=best.o;
    if(best.o==='h'){it.x=v;it.y=best.f;}else{it.x=best.f;it.y=v;}
  }else{
    it.x=clamp(Math.round(p.x*2)/2,0,WW);it.y=clamp(Math.round(p.y*2)/2,0,WH);
  }
}

/* ---------- pointer ---------- */
let drag=null;
const ptrs=new Map();let pinch=null;
function clampView(){VW=W/z;VH=H/z;vx=clamp(vx,0,Math.max(0,WW-VW));vy=clamp(vy,0,Math.max(0,WH-VH));}
function updateZoomLbl(){$('zoomLbl').textContent=Math.round(z*100)+'%';}
function zoomTo(nz,wx,wy,ax,ay){
  z=clamp(nz,0.5,4);VW=W/z;VH=H/z;vx=wx-ax*VW;vy=wy-ay*VH;clampView();updateZoomLbl();draw();
}
function fitView(){
  if(!rooms.length){zoomTo(1,0,0,0,0);return;}
  const x0=Math.min(...rooms.map(r=>r.x))-2,y0=Math.min(...rooms.map(r=>r.y))-2;
  const x1=Math.max(...rooms.map(r=>r.x+r.w))+2,y1=Math.max(...rooms.map(r=>r.y+r.h))+2;
  zoomTo(Math.min(W/(x1-x0),H/(y1-y0),2.5),(x0+x1)/2,(y0+y1)/2,0.5,0.5);
}
function pinchInfo(){
  const a=[...ptrs.values()],r=cvs.getBoundingClientRect();
  return{d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,ax:((a[0].x+a[1].x)/2-r.left)/r.width,ay:((a[0].y+a[1].y)/2-r.top)/r.height};
}
cvs.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cvs.getBoundingClientRect(),ax=(e.clientX-r.left)/r.width,ay=(e.clientY-r.top)/r.height;
  zoomTo(z*(e.deltaY<0?1.15:1/1.15),vx+ax*VW,vy+ay*VH,ax,ay);
},{passive:false});
$('zoomIn').addEventListener('click',()=>zoomTo(z*1.25,vx+VW/2,vy+VH/2,0.5,0.5));
$('zoomOut').addEventListener('click',()=>zoomTo(z/1.25,vx+VW/2,vy+VH/2,0.5,0.5));
$('zoomLbl').addEventListener('click',()=>zoomTo(1,vx+VW/2,vy+VH/2,0.5,0.5));
$('zoomFit').addEventListener('click',fitView);
cvs.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){
    drag=null;const pi=pinchInfo();pinch={d0:pi.d,z0:z,wx:vx+pi.ax*VW,wy:vy+pi.ay*VH};draw();return;
  }
  if(ptrs.size>2)return;
  const p=pt(e);
  const hr=(e.pointerType==='touch'?18:12)/p.ppu;
  let wh=null;
  if(sel&&sel.k==='item'&&RESIZABLE.includes(sel.o.k)){
    const w=sel.o,hz=w.o==='h';
    for(const e2 of ['a','b']){
      const sg=e2==='a'?-1:1,hx=hz?w.x+sg*w.len/2:w.x,hy=hz?w.y:w.y+sg*w.len/2;
      if(Math.hypot(hx-p.x,hy-p.y)<=hr){wh=e2;break;}
    }
  }
  let it=wh?null:hitItem(p);
  if(wh){drag={t:'wresize',o:sel.o,e:wh,orig:{x:sel.o.x,y:sel.o.y,len:sel.o.len}};}
  else if(it){sel={k:'item',o:it};drag={t:'item',o:it};}
  else{
    let ch=null;
    if(sel&&sel.k==='room'){for(const h of cutHandles(sel.o,5/p.ppu)){if(Math.hypot(h.x-p.x,h.y-p.y)<=hr){ch=h.i;break;}}}
    let handle=null;
    const sr=sel&&(sel.k==='room'?sel.o:sel.k==='furn'?fbox(sel.o):null);
    if(sr){
      for(const h of handlePts(sr)){if(Math.hypot(h.x-p.x,h.y-p.y)<=hr){handle=h.n;break;}}
    }
    if(ch!==null){drag={t:'cut',o:sel.o,i:ch};}
    else if(handle){
      if(sel.k==='furn'){const f=sel.o;drag={t:'fresize',o:f,h:handle,orig:fbox(f)};}
      else{const r=sel.o;drag={t:'resize',o:r,h:handle,orig:{x:r.x,y:r.y,w:r.w,h:r.h}};}
    }
    else{
      const f=hitFurn(p);
      if(f){sel={k:'furn',o:f};drag={t:'furn',o:f,p0:p,orig:{x:f.x,y:f.y}};}
      else{
        const r=hitRoom(p);
        if(r){sel={k:'room',o:r};drag={t:'move',o:r,p0:p,orig:{x:r.x,y:r.y}};}
        else{sel=null;drag={t:'pan',cx:e.clientX,cy:e.clientY,vx0:vx,vy0:vy};}
      }
    }
  }
  if(drag){try{cvs.setPointerCapture(e.pointerId);}catch(_){}}
  updatePanel();draw();
});
cvs.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const pi=pinchInfo();zoomTo(pinch.z0*pi.d/pinch.d0,pinch.wx,pinch.wy,pi.ax,pi.ay);return;}
  if(!drag)return;
  if(drag.t==='pan'){
    const r=cvs.getBoundingClientRect();
    vx=drag.vx0-(e.clientX-drag.cx)/r.width*VW;vy=drag.vy0-(e.clientY-drag.cy)/r.height*VH;clampView();draw();return;
  }
  const p=pt(e);
  if(drag.t==='cut'){
    const r=drag.o,i=drag.i,c0=cutCorner(r,i),d=CUT_DIR[i],off=4.4*5/p.ppu;
    const v=(p.x-c0[0])*d[0]+(p.y-c0[1])*d[1]-2*off;
    const k=(r.cut||[0,0,0,0]).slice();
    k[i]=0;r.cut=k;
    r.cut[i]=clamp(Math.round(v*2)/2,0,Math.max(0,cutMax(r,i)));
  }
  else if(drag.t==='wresize'){
    const w=drag.o,og=drag.orig,hz=w.o==='h';
    const c0=hz?og.x:og.y;let a=c0-og.len/2,b=c0+og.len/2;
    const pos=Math.round((hz?p.x:p.y)*2)/2;
    if(drag.e==='a')a=clamp(pos,0,b-1);else b=clamp(pos,a+1,hz?WW:WH);
    w.len=b-a;
    if(hz)w.x=(a+b)/2;else w.y=(a+b)/2;
  }
  else if(drag.t==='item'){snapItem(drag.o,p);}
  else if(drag.t==='fresize'){
    const f=drag.o,og=drag.orig,sn=v=>Math.round(v*2)/2;
    let L=og.x,R=og.x+og.w,T=og.y,B=og.y+og.h;
    if(drag.h.includes('w'))L=clamp(sn(p.x),0,R-1);
    if(drag.h.includes('e'))R=clamp(sn(p.x),L+1,WW);
    if(drag.h.includes('n'))T=clamp(sn(p.y),0,B-1);
    if(drag.h.includes('s'))B=clamp(sn(p.y),T+1,WH);
    const ew=R-L,eh=B-T,q=f.r%2;
    f.x=(L+R)/2;f.y=(T+B)/2;f.w=q?eh:ew;f.h=q?ew:eh;
    if(f.f==='north'||f.f==='tree'){const mm=Math.max(f.w,f.h);f.w=mm;f.h=mm;}
  }
  else if(drag.t==='furn'){
    const f=drag.o;
    f.x=clamp(Math.round((drag.orig.x+p.x-drag.p0.x)*2)/2,0,WW);
    f.y=clamp(Math.round((drag.orig.y+p.y-drag.p0.y)*2)/2,0,WH);
  }else if(drag.t==='move'){
    const r=drag.o;
    const nx=clamp(drag.orig.x+Math.round(p.x-drag.p0.x),0,WW-r.w),ny=clamp(drag.orig.y+Math.round(p.y-drag.p0.y),0,WH-r.h);
    const dx=nx-r.x,dy=ny-r.y;
    r.x=nx;r.y=ny;
    for(const f of furn)if(f.rid===r.id){f.x+=dx;f.y+=dy;}
  }else{
    const r=drag.o,og=drag.orig;let L=og.x,R=og.x+og.w,T=og.y,B=og.y+og.h;
    if(drag.h.includes('w'))L=clamp(Math.round(p.x),0,R-2);
    if(drag.h.includes('e'))R=clamp(Math.round(p.x),L+2,WW);
    if(drag.h.includes('n'))T=clamp(Math.round(p.y),0,B-2);
    if(drag.h.includes('s'))B=clamp(Math.round(p.y),T+2,WH);
    r.x=L;r.y=T;r.w=R-L;r.h=B-T;normCut(r);
  }
  draw();
});
const endDrag=e=>{
  if(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;}
  if(drag&&(drag.t==='furn'||drag.t==='fresize')){const r=hitRoom({x:drag.o.x,y:drag.o.y});drag.o.rid=r?r.id:null;}
  const had=drag;drag=null;draw();
  if(had&&had.t!=='pan')commit();
};

/* ---------- actions ---------- */
function removeSel(){
  if(!sel)return;
  const arr=sel.k==='room'?rooms:sel.k==='furn'?furn:items,i=arr.indexOf(sel.o);
  if(i>=0)arr.splice(i,1);
  if(sel.k==='room'){for(let j=furn.length-1;j>=0;j--)if(furn[j].rid===sel.o.id)furn.splice(j,1);}
  sel=null;commit();updatePanel();draw();
}
function overlaps(x,y,w,h){return rooms.some(r=>x<r.x+r.w&&x+w>r.x&&y<r.y+r.h&&y+h>r.y);}
function addRoom(id){
  const T=TYPES.find(t=>t.id===id);
  let pos=null;
  const x0=Math.ceil(vx)+1,y0=Math.ceil(vy)+1,x1=Math.min(WW,vx+VW),y1=Math.min(WH,vy+VH);
  for(let y=y0;y<=y1-T.h&&!pos;y+=2)for(let x=x0;x<=x1-T.w;x+=2){if(!overlaps(x,y,T.w,T.h)){pos={x,y};break;}}
  if(!pos)pos={x:x0,y:y0};
  const r={id:uid++,t:id,name:null,x:pos.x,y:pos.y,w:T.w,h:T.h};
  rooms.push(r);if(mode==='estate')genFixtures(r);
  sel={k:'room',o:r};commit();updatePanel();draw();
}
function addItem(k){
  const len=OPEN_LEN[k];
  const ref=(sel&&sel.k==='room')?sel.o:rooms[rooms.length-1];
  const it={id:uid++,k,len,d:0,o:'h',x:vx+VW/2,y:vy+VH/2};
  if(ref){it.x=ref.x+ref.w/2;it.y=ref.y;}
  snapItem(it,{x:it.x,y:it.y});
  items.push(it);sel={k:'item',o:it};commit();updatePanel();draw();
}

function addFurn(k){
  const own=sel&&sel.k==='furn'&&sel.o.rid?rooms.find(r=>r.id===sel.o.rid):null;
  const ref=(sel&&sel.k==='room')?sel.o:(own||rooms[rooms.length-1]);
  const f={id:uid++,f:k,s:STRUCT.includes(k),r:0,w:FURN[k].w,h:FURN[k].h,x:ref?ref.x+ref.w/2:vx+VW/2,y:ref?ref.y+ref.h/2:vy+VH/2,rid:ref?ref.id:null};
  f.x=Math.round(f.x*2)/2;f.y=Math.round(f.y*2)/2;
  if(k==='text')f.text=tr('text_default');
  if(k==='north')f.ang=0;
  furn.push(f);sel={k:'furn',o:f};commit();updatePanel();draw();
  if(k==='text'){const inp=$('rName');inp.focus();inp.select();}
}
function ensureFx(){if(mode==='estate')for(const r of rooms)if(!r.fxDone||(r.t==='parking'&&!r.fxV))genFixtures(r);}

/* ---------- export ---------- */
function exportCanvas(){
  const s=40;
  let ox=0,oy=0,cw=W,ch=H;
  const rects=rooms.map(r=>({x:r.x,y:r.y,w:r.w,h:r.h}));
  for(const f of furn)if(mode==='estate'||f.s)rects.push(fbox(f));
  if(rects.length){
    const m=3;
    const x0=Math.min(...rects.map(r=>r.x))-m,y0=Math.min(...rects.map(r=>r.y))-m;
    const x1=Math.max(...rects.map(r=>r.x+r.w))+m,y1=Math.max(...rects.map(r=>r.y+r.h))+m;
    ox=x0;oy=y0;cw=x1-x0;ch=y1-y0;
  }
  const c=document.createElement('canvas');
  c.width=Math.round(cw*s);c.height=Math.round(ch*s);
  render(c.getContext('2d'),s,{grid:false,selObj:null,ox,oy,cw,ch,full:mode==='estate'});
  return c;
}

/* ---------- undo / redo, autosave, JSON ---------- */
const KEY='daigorou-floorplanmaker-v1';
let undoS=[],redoS=[],lastDoc='',lastCur=0;
const docStr=()=>JSON.stringify(floors);
function updateUndoBtns(){$('undoBtn').disabled=!undoS.length;$('redoBtn').disabled=!redoS.length;}
function stateObj(){return{v:1,floors,cur,mode,furnLabels};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(stateObj()));}catch(e){}}
function commit(prevCur){
  const d=docStr();
  if(d===lastDoc)return;
  undoS.push({d:lastDoc,cur:prevCur!==undefined?prevCur:lastCur});
  if(undoS.length>100)undoS.shift();
  redoS=[];lastDoc=d;lastCur=cur;save();updateUndoBtns();
}
function maxId(){
  let m=0;
  for(const f of floors)for(const k of ['rooms','items','furn'])for(const o of f[k])if(typeof o.id==='number'&&o.id>m)m=o.id;
  return m;
}
function restoreDoc(sn){
  floors=JSON.parse(sn.d);cur=clamp(sn.cur,0,floors.length-1);
  rooms=floors[cur].rooms;items=floors[cur].items;furn=floors[cur].furn;
  uid=Math.max(uid,maxId()+1);sel=null;drag=null;ensureFx();
  lastDoc=docStr();lastCur=cur;
  renderFloors();updatePanel();draw();save();updateUndoBtns();
}
function undo(){if(!undoS.length)return;redoS.push({d:docStr(),cur});restoreDoc(undoS.pop());}
function redo(){if(!redoS.length)return;undoS.push({d:docStr(),cur});restoreDoc(redoS.pop());}
$('undoBtn').addEventListener('click',undo);
$('redoBtn').addEventListener('click',redo);
const num=v=>typeof v==='number'&&isFinite(v);
function cleanState(o){
  if(!o||!Array.isArray(o.floors)||!o.floors.length||o.floors.length>10)return null;
  const out=[];
  for(const f of o.floors){
    if(!f||!Array.isArray(f.rooms)||!Array.isArray(f.items)||!Array.isArray(f.furn))return null;
    out.push({
      rooms:f.rooms.filter(r=>r&&num(r.x)&&num(r.y)&&num(r.w)&&num(r.h)&&TYPES.some(t=>t.id===r.t)).map(r=>({...r,name:typeof r.name==='string'?r.name.slice(0,60):null,cut:Array.isArray(r.cut)&&r.cut.length===4&&r.cut.every(num)?r.cut:undefined})),
      items:f.items.filter(i=>i&&num(i.x)&&num(i.y)&&num(i.len)&&OPEN_LEN[i.k]!==undefined&&(i.o==='h'||i.o==='v')).map(i=>({...i,d:(i.d|0)&3})),
      furn:f.furn.filter(g=>g&&num(g.x)&&num(g.y)&&num(g.w)&&num(g.h)&&FURN[g.f]).map(g=>({...g,r:(((g.r|0)%4)+4)%4,text:typeof g.text==='string'?g.text.slice(0,80):undefined,ang:num(g.ang)?g.ang:undefined,flip:g.flip===true?true:undefined}))
    });
  }
  let n=0;
  for(const f of out)for(const k of ['rooms','items','furn'])for(const x of f[k])if(typeof x.id==='number'&&x.id>n)n=x.id;
  for(const f of out)for(const k of ['rooms','items','furn'])for(const x of f[k])if(typeof x.id!=='number')x.id=++n;
  return{floors:out,cur:clamp(o.cur|0,0,out.length-1),mode:o.mode==='simple'?'simple':'estate',furnLabels:!!o.furnLabels};
}
function applyState(o){
  floors=o.floors;cur=o.cur;rooms=floors[cur].rooms;items=floors[cur].items;furn=floors[cur].furn;
  mode=o.mode;furnLabels=o.furnLabels;$('furnLabelChk').checked=furnLabels;
  uid=Math.max(uid,maxId()+1);sel=null;drag=null;
}
function loadSaved(){
  try{const o=cleanState(JSON.parse(localStorage.getItem(KEY)||'null'));if(!o)return false;applyState(o);return true;}catch(e){return false;}
}
function afterReplace(pc){
  commit(pc);setMode(mode);renderFloors();fitView();updatePanel();draw();
}
$('fileBtn').addEventListener('click',e=>{e.stopPropagation();$('fileMenu').hidden=!$('fileMenu').hidden;});
document.addEventListener('click',e=>{if(!e.target.closest('.menuwrap'))$('fileMenu').hidden=true;});
$('mSave').addEventListener('click',()=>{
  $('fileMenu').hidden=true;
  const b=new Blob([JSON.stringify(stateObj(),null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='floorplan.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
});
$('mLoad').addEventListener('click',()=>{$('fileMenu').hidden=true;$('fileIn').value='';$('fileIn').click();});
$('fileIn').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  try{
    const o=cleanState(JSON.parse(await f.text()));
    if(!o)throw new Error('bad');
    const pc=cur;applyState(o);afterReplace(pc);
  }catch(err){alert(tr('err_load'));}
});
$('mNew').addEventListener('click',()=>{
  $('fileMenu').hidden=true;
  if(!confirm(tr('confirm_new')))return;
  const pc=cur;applyState({floors:[{rooms:[],items:[],furn:[]}],cur:0,mode,furnLabels});afterReplace(pc);
});
function dupSel(){
  if(!sel)return;
  const cp=o=>JSON.parse(JSON.stringify(o));
  if(sel.k==='room'){
    const r=sel.o,n=cp(r);n.id=uid++;n.x=clamp(r.x+2,0,WW-r.w);n.y=clamp(r.y+2,0,WH-r.h);
    const dx=n.x-r.x,dy=n.y-r.y;rooms.push(n);
    for(const f of furn.filter(f=>f.rid===r.id)){const g=cp(f);g.id=uid++;g.rid=n.id;g.x+=dx;g.y+=dy;furn.push(g);}
    sel={k:'room',o:n};
  }else if(sel.k==='furn'){
    const f=sel.o,g=cp(f);g.id=uid++;g.x=clamp(f.x+1,0,WW);g.y=clamp(f.y+1,0,WH);
    const r=hitRoom({x:g.x,y:g.y});g.rid=r?r.id:null;furn.push(g);sel={k:'furn',o:g};
  }else{
    const it=sel.o,n=cp(it);n.id=uid++;
    if(it.o==='h')n.x+=it.len+0.5;else n.y+=it.len+0.5;
    snapItem(n,{x:n.x,y:n.y});items.push(n);sel={k:'item',o:n};
  }
  commit();updatePanel();draw();
}
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  const k=e.key.toLowerCase();
  if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();}
  else if(k==='y'){e.preventDefault();redo();}
  else if(k==='d'){e.preventDefault();dupSel();}
});

/* ---------- palette tabs ---------- */
let tab='room';
function setTab(t){
  if(t==='furn'&&mode!=='estate')t='room';
  tab=t;
  document.querySelectorAll('#palTabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
  $('panRoom').hidden=t!=='room';$('panOpen').hidden=t!=='open';$('panFurn').hidden=t!=='furn';
}
document.querySelectorAll('#palTabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

/* ---------- start: restore the autosaved plan, otherwise a small sample ---------- */
if(!loadSaved()){
  [['ldk',4,4,12,10],['western',16,4,6,8],['bath',16,12,4,4],['entrance',12,14,4,4]].forEach(([t,x,y,w,h])=>{
    rooms.push({id:uid++,t,name:null,x,y,w,h});
  });
}
applyLang();
lastDoc=docStr();lastCur=cur;updateUndoBtns();updateZoomLbl();
})();
</script>
